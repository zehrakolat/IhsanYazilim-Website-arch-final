<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Turkiye Haritasi - Gezinen Pin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', 'Inter', Arial, sans-serif;
    background: #FFFFFF;
    padding: 24px;
    display: flex; align-items: center; justify-content: center;
    gap: 32px;
    min-height: 100vh;
  }
  .map-wrap { position: relative; max-width: 720px; width: 100%; flex: 1 1 auto; }
  svg { width: 100%; height: auto; display: block; }
  .top5 { flex: 0 0 320px; max-width: 340px; }
  .top5 h3 { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8492ab; margin-bottom: 22px; }
  .top5 .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .top5 .rank { font-family: 'Sora', 'Manrope', sans-serif; font-size: 15px; font-weight: 800; color: #b4bfd0; width: 14px; flex-shrink: 0; }
  .top5 .city { font-size: 18px; font-weight: 700; color: #101828; }
  .top5 .val { margin-left: auto; font-family: 'Sora', 'Manrope', sans-serif; font-size: 19px; font-weight: 800; color: #1560D8; }
  .top5 .bar { height: 7px; border-radius: 99px; background: #eef2f8; margin: 0 0 22px 28px; overflow: hidden; }
  .top5 .bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg,#1560D8,#22A24B); }
  .top5 .foot { font-size: 12.5px; color: #9aa7ba; margin-top: 24px; border-top: 1px solid #eef1f6; padding-top: 16px; }
  @media (max-width: 820px) { body { flex-direction: column; } .top5 { flex-basis: auto; width: 100%; max-width: 620px; } }

  .travel-pin { transition: opacity 0.25s ease; }
  .travel-pin.hidden { opacity: 0; }

  .tooltip {
    position: absolute;
    transform: translate(-50%, -100%);
    background: #101828;
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.35);
    z-index: 10;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .count { color: #7FE39A; margin-left: 6px; }
  .tooltip::after {
    content: "";
    position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #101828;
  }
</style>

  const svgEl = document.querySelector('svg');
  const mapWrap = document.getElementById('mapWrap');
  const travelPin = document.getElementById('travelPin');
  const tooltip = document.getElementById('tooltip');
  const ttName = document.getElementById('ttName');
  const ttCount = document.getElementById('ttCount');

  const VBW = 1456, VBH = 800;

  function svgToScreen(x, y) {
    const rect = svgEl.getBoundingClientRect();
    const wrapRect = mapWrap.getBoundingClientRect();
    const scale = rect.width / VBW;
    return {
      x: (rect.left - wrapRect.left) + x * scale,
      y: (rect.top - wrapRect.top) + y * scale
    };
  }

  function showTooltip(name, count, x, y) {
    ttName.textContent = name;
    ttCount.textContent = count;
    const pos = svgToScreen(x, y - 34);
    tooltip.style.left = pos.x + 'px';
    tooltip.style.top = pos.y + 'px';
    tooltip.classList.add('show');
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  let travelIndex = 0;
  let travelTimer = null;
  let userHovering = false;

  function moveTravelPinTo(wp, animate) {
    travelPin.style.transition = animate ? 'transform 1.6s cubic-bezier(0.45,0,0.2,1)' : 'none';
    travelPin.setAttribute('transform', 'translate(' + wp.x + ',' + wp.y + ')');
    showTooltip(wp.name, wp.count, wp.x, wp.y);
  }

  function stepTravel() {
    if (userHovering) return;
    const wp = waypoints[travelIndex % waypoints.length];
    moveTravelPinTo(wp, true);
    travelIndex++;
  }

  function startTravel() {
    travelPin.classList.remove('hidden');
    stepTravel();
    travelTimer = setInterval(stepTravel, 3500);
  }

  function stopTravel() {
    clearInterval(travelTimer);
    travelPin.classList.add('hidden');
    hideTooltip();
  }

  document.querySelectorAll('.city-pin').forEach(pin => {
    pin.addEventListener('mouseenter', () => {
      userHovering = true;
      stopTravel();
      const name = pin.getAttribute('data-name');
      const count = pin.getAttribute('data-count');
      const cx = parseFloat(pin.getAttribute('data-cx'));
      const cy = parseFloat(pin.getAttribute('data-cy'));
      showTooltip(name, count, cx, cy);
    });
  });

  mapWrap.addEventListener('mouseleave', () => {
    userHovering = false;
    startTravel();
  });

  startTravel();
